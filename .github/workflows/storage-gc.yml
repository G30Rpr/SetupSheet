name: Storage Garbage Collection

on:
  schedule:
    # Weekly read-only inventory after the database's 24h upload grace period.
    - cron: "0 4 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview eligible objects without deleting"
        type: boolean
        default: true
      grace:
        description: "Grace interval (e.g. 24 hours; maximum 30 days)"
        type: string
        default: "24 hours"

permissions:
  contents: read

concurrency:
  group: setupsheets-storage-gc
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Sweep orphaned Storage safely
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GC_APPLY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == false }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          GC_GRACE: ${{ github.event_name == 'workflow_dispatch' && inputs.grace || '24 hours' }}
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_SERVICE_ROLE_KEY" || -z "$SUPABASE_URL" ]]; then
            echo "::error::Required Supabase storage cleanup secrets are not configured."
            exit 1
          fi
          args=(--grace "$GC_GRACE")
          if [[ "$GC_APPLY" == "true" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
              echo "::error::Storage deletion must select the default branch."
              exit 1
            fi
            current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$DEFAULT_BRANCH" --jq '.object.sha')
            if [[ "$current_sha" != "$GITHUB_SHA" ]]; then
              echo "::error::Default branch advanced; review and dispatch its current revision."
              exit 1
            fi
            args+=(--apply)
          else
            args+=(--dry-run)
          fi
          npm run storage:sweep -- "${args[@]}"
