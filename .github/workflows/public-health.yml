name: SetupSheet public availability
on:
  schedule:
    # Six checks/day. Github may delay scheduled workflows at peak periods.
    - cron: "13 */4 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: setupsheets-public-health
  cancel-in-progress: false
jobs:
  public-uptime:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Check public endpoints without credentials or writes
        run: node scripts/check-public-uptime.mjs
