name: CI

on:
  push:
  pull_request:

env:
  # Public/client-exposed by design (anon key + RLS is the whole security
  # model), so these are safe placeholders -- no real Supabase project or
  # GitHub repo secret is required for lint/test/build/E2E to run. A
  # loopback address with nothing listening: no DNS lookup involved, so
  # every connection attempt fails instantly and deterministically with
  # ECONNREFUSED, rather than depending on how fast (or slow) a given
  # network resolves/rejects a nonexistent public hostname.
  NEXT_PUBLIC_SUPABASE_URL: https://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiJ9.placeholder-ci-key

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: lint-test-build
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test

  db-migrations:
    # Applies every migration under supabase/migrations/ to a real Postgres
    # instance and runs supabase/testing/*.test.sql against it -- the app's
    # own lint/test/build/e2e jobs above never touch a real database (the
    # placeholder Supabase URL is unreachable by design), so this is the
    # only job that would catch a migration that fails to apply or a
    # regression in the SQL functions/triggers those tests cover.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - run: npm run test:db
        env:
          PGPASSWORD: postgres
