name: CI

on:
  push:
  pull_request:

env:
  # Public/client-exposed by design (anon key + RLS is the whole security
  # model), so these are safe placeholders -- no real Supabase project or
  # GitHub repo secret is required for lint/test/build/E2E to run. A
  # loopback address with nothing listening: no DNS lookup involved, so
  # every connection attempt fails instantly and deterministically with
  # ECONNREFUSED, rather than depending on how fast (or slow) a given
  # network resolves/rejects a nonexistent public hostname.
  NEXT_PUBLIC_SUPABASE_URL: https://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiJ9.placeholder-ci-key

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # `next build` type-checks too, but only when it can resolve TypeScript and
      # it reports the first error after a long build; a separate step names the
      # job that failed.
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      # The chunk budget script that exists in the repo but nothing ran, so
      # bundle growth was only ever caught by someone remembering to.
      - run: node scripts/check-performance-budget.mjs
      # Fails on a high/critical advisory in the whole tree (dev deps included: a
      # build-time RCE is still an RCE on the deploy machine). Prod-only view:
      # `npm audit --omit=dev`, which is clean today.
      - run: npm audit --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    needs: lint-test-build
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test

  db-migrations:
    # Applies every migration under supabase/migrations/ to a real Postgres
    # instance and runs supabase/testing/*.test.sql against it -- the app's
    # own lint/test/build/e2e jobs above never touch a real database (the
    # placeholder Supabase URL is unreachable by design), so this is the
    # only job that would catch a migration that fails to apply or a
    # regression in the SQL functions/triggers those tests cover.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - run: npm run test:db
        env:
          PGPASSWORD: postgres
