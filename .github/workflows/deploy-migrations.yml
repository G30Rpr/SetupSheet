name: Deploy Migrations

# Pushes validate and list pending migrations. Only a manual dispatch can apply.
# Configure required reviewers for the production-database GitHub Environment.
# See docs/migration-release-controls.md before enabling the release credential.
permissions:
  contents: read

on:
  push:
    branches: [SetUpSheet]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/deploy-migrations.yml"
      - "scripts/deploy-migrations*"
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Exact default-branch commit approved for this database release"
        type: string
        required: true
      dry_run:
        description: "List pending migrations without applying them"
        type: boolean
        default: true

concurrency:
  group: deploy-migrations-production
  cancel-in-progress: false

jobs:
  validate-and-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate all migrations against a fresh database
        run: npm run test:db
        env:
          PGPASSWORD: postgres
      - name: Read-only pending migration inventory
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/deploy-migrations.sh --dry-run

  apply:
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run == false
    needs: validate-and-plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-database
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Require the exact approved default-branch revision
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" || "$RELEASE_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::Dispatch must select the default branch and its exact approved commit SHA."
            exit 1
          fi
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$DEFAULT_BRANCH" --jq '.object.sha')
          if [[ "$current_sha" != "$RELEASE_SHA" ]]; then
            echo "::error::Default branch advanced after approval; review and dispatch the new SHA."
            exit 1
          fi
      - name: Apply reviewed pending migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_RELEASE_DB_URL }}
        run: bash scripts/deploy-migrations.sh --apply
